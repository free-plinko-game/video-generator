server {
    listen 80;
    server_name contentfactoryy.com www.contentfactoryy.com;

    # Redirect HTTP to HTTPS (uncomment after certbot)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for video generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Serve static files directly
    location /static {
        alias /var/www/contentfactory/static;
        expires 1d;
    }

    # Serve generated videos
    location /outputs {
        alias /var/www/contentfactory/outputs;
        expires 7d;
    }

    # Max upload size for any future uploads
    client_max_body_size 500M;
}
